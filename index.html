<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obscura</title>
<meta name="description" content="A picture-guessing game. A movie scene, an actor or an anime character starts as a blur. Name it early and the points are yours.">
<meta name="theme-color" content="#14110f">
<meta property="og:type" content="website">
<meta property="og:title" content="Obscura">
<meta property="og:description" content="Name the movie, actor or anime character while it is still a blur.">
<meta property="og:url" content="https://hugurozmen.github.io/obscura/">
<meta property="og:image" content="https://hugurozmen.github.io/obscura/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site" id="site">
  <a class="brand" href="#">Obscura</a>
  <nav>
    <a href="#how" data-t="nav.how"></a>
    <a href="#profile" data-t="nav.profile"></a>
    <a href="#about" data-t="nav.about"></a>
    <button class="btn ghost" id="langBtn" aria-label="Language"></button>
  </nav>
</header>

<main id="home">
  <div class="home-copy">
    <h1 class="wordmark">Obscura<b>.</b></h1>
    <p class="lede" data-t="lede"></p>
    <div class="banner" id="challenge" hidden>
      <span><strong id="chTitle"></strong><span id="chSub"></span></span>
      <button class="btn primary" id="chBtn" data-t="ch.accept"></button>
    </div>
    <button class="btn primary daily" id="dailyBtn" disabled><span><strong id="dailyTitle"></strong><span id="dailyMeta"></span></span><span aria-hidden="true">&rarr;</span></button>
    <div>
      <div class="picker">
        <div class="seg" id="kind" role="group" aria-label="Mode">
          <button data-k="classic" data-t="mode.classic"></button><button data-k="sprint" data-t="mode.sprint"></button><button data-k="survival" data-t="mode.survival"></button>
        </div>
        <div class="seg" id="diff" role="group" aria-label="Difficulty">
          <button data-d="easy" data-t="diff.easy"></button><button data-d="normal" data-t="diff.normal"></button><button data-d="hard" data-t="diff.hard"></button>
        </div>
      </div>
      <p class="mono" id="kindNote" style="margin:0 0 8px"></p>
      <div class="cats" id="cats"></div>
    </div>
    <p class="fine"><span data-t="fine"></span> <a href="#about" data-t="fine.link"></a></p>
  </div>
  <div class="hero">
    <div class="hero-frame"><canvas id="heroCanvas" width="600" height="800"></canvas></div>
    <div class="edge mono"><span id="heroFx">&nbsp;</span><span id="heroName">&nbsp;</span></div>
  </div>
</main>

<section id="play" hidden>
  <div class="bar">
    <button class="name" id="quitBtn">Obscura</button>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div id="hud" hidden></div>
    <div class="total"><span class="mono" data-t="score"></span> <span id="total">0</span></div>
  </div>
  <div class="edge mono"><span id="roundLabel"></span><span id="fxLabel"></span></div>
  <div id="stage"><div id="frame"><canvas id="cv"></canvas><div id="flash" hidden><span id="flashName"></span><span id="flashPts"></span></div></div></div>

  <div id="guessing">
    <div class="meter"><span class="mono" data-t="pointsLeft"></span><div class="track"><div class="fill" id="fill"></div></div><span class="mono" id="avail">1000</span></div>
    <form class="ask" id="askForm" autocomplete="off" style="margin-top:10px">
      <div class="field">
        <ul id="opts" role="listbox" hidden></ul>
        <input id="guess" type="text" role="combobox" aria-controls="opts" aria-expanded="false" aria-autocomplete="list" spellcheck="false" autocapitalize="off">
      </div>
      <button type="button" class="btn" id="hintBtn"></button>
      <button type="button" class="btn ghost" id="giveUpBtn"></button>
    </form>
    <div class="sub" style="margin-top:8px">
      <span class="mono"><span data-t="wrongGuesses"></span> <span class="strikes" id="strikes"><i></i><i></i><i></i></span></span>
      <span class="mono" id="hintText"></span>
    </div>
  </div>

  <div id="verdict" hidden>
    <span class="mono tag" id="vTag"></span>
    <h2 id="vTitle"></h2>
    <div class="pts" id="vPts"></div>
    <p id="vSub"></p>
    <p class="credit" id="vCredit"></p>
    <button class="btn primary next" id="nextBtn"></button>
  </div>
</section>

<section id="end" hidden>
  <span class="mono" id="endLabel"></span>
  <p class="score-big"><span id="endScore">0</span><small id="endOutOf"></small></p>
  <p class="rank" id="endRank"></p>
  <div class="rows" id="endRows"></div>
  <div class="actions">
    <button class="btn primary" id="againBtn"></button>
    <button class="btn" id="challengeBtn" data-t="end.challenge"></button>
    <button class="btn" id="copyBtn"></button>
    <button class="btn ghost" id="homeBtn" data-t="end.home"></button>
    <span class="mono" id="endBest"></span>
  </div>
  <textarea id="shareText" rows="4" readonly hidden aria-label="Share"></textarea>
</section>

<section id="how" class="page" hidden>
  <h1 data-t="how.title"></h1>
  <ol>
    <li data-t-html="how.1"></li><li data-t-html="how.2"></li><li data-t-html="how.3"></li><li data-t-html="how.4"></li>
  </ol>
  <div>
    <h2 data-t="how.modes"></h2>
    <div class="modes3">
      <div><h3 data-t="mode.classic"></h3><p data-t="how.classic"></p></div>
      <div><h3 data-t="mode.sprint"></h3><p data-t="how.sprint"></p></div>
      <div><h3 data-t="mode.survival"></h3><p data-t="how.survival"></p></div>
    </div>
  </div>
  <div><h2 data-t="how.more"></h2><p data-t-html="how.daily"></p><p data-t-html="how.challenge"></p><p data-t-html="how.diff"></p></div>
  <a class="btn primary" href="#" style="align-self:flex-start;text-decoration:none" data-t="how.cta"></a>
</section>

<section id="profile" class="page" hidden>
  <h1 data-t="pf.title"></h1>
  <div><label class="mono" for="nick" data-t="pf.nick" style="display:block;margin-bottom:6px"></label><input id="nick" type="text" maxlength="16" autocomplete="off"></div>
  <div class="stats" id="pfStats"></div>
  <div><h2 data-t="pf.cats"></h2><div class="bars" id="pfCats"></div></div>
  <div><h2 data-t="pf.bests"></h2><div class="bars" id="pfBests"></div></div>
  <div><h2 id="pfAchTitle"></h2><div class="ach" id="pfAch"></div></div>
  <div><button class="btn ghost" id="resetBtn" data-t="pf.reset"></button> <span class="mono" id="resetMsg"></span></div>
</section>

<section id="about" class="page" hidden>
  <h1 data-t="ab.title"></h1>
  <div><h2 data-t="ab.what"></h2><p data-t="ab.whatText"></p></div>
  <div id="keyBox">
    <h2 data-t="ab.key"></h2>
    <p data-t-html="ab.keyText"></p>
    <div class="keyrow">
      <input id="tmdbKey" type="text" spellcheck="false" autocomplete="off" aria-label="TMDB API key">
      <button class="btn primary" id="keySave" data-t="ab.keySave"></button>
      <button class="btn ghost" id="keyClear" data-t="ab.keyClear"></button>
    </div>
    <p class="mono" id="keyMsg" style="margin-top:8px"></p>
  </div>
  <div><h2 data-t="ab.src"></h2><p data-t-html="ab.srcText"></p><p data-t="ab.rights"></p></div>
  <div><h2 data-t="ab.install"></h2><p data-t="ab.installText"></p><button class="btn" id="installBtn" data-t="ab.installBtn" hidden></button></div>
</section>

<div id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
